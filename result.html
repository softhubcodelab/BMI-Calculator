<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0ea5e9">
  <title>BMI Calculator | Result</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">

  <link rel="canonical" href="https://smartbmicalculator.vercel.app/result">
  <meta name="description" content="Calculate your BMI quickly and easily. Check your body mass index and understand your BMI range.">
  <meta property="og:site_name" content="BMI Calculator">
  <meta property="og:type" content="website">
  <meta property="og:title" content="BMI Calculator">
  <meta property="og:description" content="Calculate your BMI quickly and easily. Check your body mass index and understand your BMI range.">
  <meta property="og:url" content="https://smartbmicalculator.vercel.app/result">
  <meta property="og:image" content="https://smartbmicalculator.vercel.app/share-image.jpg?v=2">
  <meta property="og:image:secure_url" content="https://smartbmicalculator.vercel.app/share-image.jpg?v=2">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="BMI Calculator">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="BMI Calculator">
  <meta name="twitter:description" content="Calculate your BMI quickly and easily. Check your body mass index and understand your BMI range.">
  <meta name="twitter:image" content="https://smartbmicalculator.vercel.app/share-image.jpg?v=2">

</head>
<body>
  <main class="app-shell">
    <section class="phone-card result-page">
      <button class="back-btn" onclick="location.href='/calculator'" aria-label="Back to calculator">←</button>

      <h1 class="page-title">Your BMI Result</h1>

      <div class="bmi-ring" id="bmiRing">
        <div class="bmi-number" id="bmiNumber">--</div>
      </div>

      <p class="result-message" id="resultMessage">Enter your details to calculate BMI.</p>

      <div class="stats-grid" id="statsGrid">
        <div id="ageCell"><span>Age</span><strong id="resultAge">--</strong></div>
        <div><span>Weight</span><strong id="resultWeight">--</strong></div>
        <div><span>Height</span><strong id="resultHeight">--</strong></div>
      </div>

      <div class="bmi-scale">
        <div class="scale-row"><i class="dot very-low"></i><span>Very severely underweight</span><b>&lt; 16</b></div>
        <div class="scale-row"><i class="dot low"></i><span>Severely underweight</span><b>16.0 – 16.9</b></div>
        <div class="scale-row"><i class="dot under"></i><span>Underweight</span><b>17.0 – 18.4</b></div>
        <div class="scale-row active" data-category="Normal"><i class="dot normal"></i><span>Normal</span><b>18.5 – 24.9</b></div>
        <div class="scale-row"><i class="dot over"></i><span>Overweight</span><b>25.0 – 29.9</b></div>
        <div class="scale-row"><i class="dot obese"></i><span>Obese</span><b>30.0 and above</b></div>
      </div>

      <div class="normal-weight">
        <span>Normal Weight</span>
        <strong id="normalWeight">48.4 – 62.8 Kg</strong>
      </div>

      <div class="result-actions">
        <button class="primary-btn" onclick="location.href='/calculator'">Calculate Again</button>
        <button class="primary-btn" onclick="location.href='/'">Back to Home</button>
      </div>
    </section>
  </main>

  <script src="/script.js"></script>
</body>
</html>
